name: SNIPER security tests

on:
  push:
    paths:
      - "apps/control-plane/sniper.mjs"
      - "apps/control-plane/test-sniper.mjs"
      - ".github/workflows/sniper.yml"
  pull_request:
    paths:
      - "apps/control-plane/sniper.mjs"
      - "apps/control-plane/test-sniper.mjs"
      - ".github/workflows/sniper.yml"

permissions:
  contents: read

jobs:
  sniper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test apps/control-plane/test-sniper.mjs

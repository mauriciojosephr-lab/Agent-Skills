name: revenue-engine

on:
  push:
    paths:
      - 'apps/revenue-engine/**'
      - '.github/workflows/revenue-engine.yml'
      - '.agents/skills/revenue-*/**'
  pull_request:
    paths:
      - 'apps/revenue-engine/**'
      - '.github/workflows/revenue-engine.yml'
      - '.agents/skills/revenue-*/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check apps/revenue-engine/revenue-engine.mjs
      - run: node --check apps/revenue-engine/provider-contract.mjs
      - run: node --check apps/revenue-engine/adapter-contract.mjs
      - run: node --check apps/revenue-engine/event-ledger.mjs
      - run: node --check apps/revenue-engine/opportunity-store.mjs
      - run: node --check apps/revenue-engine/capability-planner.mjs
      - run: node --check apps/revenue-engine/revenue-api.mjs
      - run: node --check apps/revenue-engine/revenue-operator.mjs
      - run: node --check apps/revenue-engine/live-provider-adapters.mjs
      - run: node --check apps/revenue-engine/integration-harness.mjs
      - run: node --check apps/revenue-engine/revenue-tool.mjs
      - run: node --check apps/revenue-engine/market-strategy.mjs
      - run: node --check apps/revenue-engine/campaign-planner.mjs
      - run: node --check apps/revenue-engine/product-listing-sales.mjs
      - run: node --check apps/revenue-engine/service-market-intelligence.mjs
      - run: node --check apps/revenue-engine/test-product-listing-sales.mjs
      - run: node --check apps/revenue-engine/test-service-market-intelligence.mjs
      - run: node --check apps/revenue-engine/test-live-provider-adapters.mjs
      - run: node apps/revenue-engine/test-revenue-engine.mjs
      - run: node apps/revenue-engine/test-revenue-components.mjs
      - run: node apps/revenue-engine/test-revenue-api.mjs
      - run: node apps/revenue-engine/test-revenue-operator.mjs
      - run: node apps/revenue-engine/test-market-strategy.mjs
      - run: node apps/revenue-engine/test-campaign-planner.mjs
      - run: node apps/revenue-engine/test-product-listing-sales.mjs
      - run: node apps/revenue-engine/test-service-market-intelligence.mjs
      - run: node apps/revenue-engine/test-live-provider-adapters.mjs

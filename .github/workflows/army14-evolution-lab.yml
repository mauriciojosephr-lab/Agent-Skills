name: ARMY-14 Evolution Lab

on:
  push:
    branches:
      - main
      - feat/army14-evolution-lab
  pull_request:
    paths:
      - 'apps/army14-evolution-lab/**'
      - '.github/agents/**'
      - 'apps/easy-developer-platform/**'
      - 'apps/revenue-engine/**'
  workflow_dispatch:
    inputs:
      mutation:
        description: Mutation label (evidence-backed candidate)
        required: false
        default: candidate-change

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install candidate dependencies
        run: npm ci --ignore-scripts

      - name: Contract tests
        run: npm run test:lab

      - name: Baseline from main
        shell: bash
        env:
          LAB_MUTATION: baseline-main
          LAB_PHASE: baseline
        run: |
          git fetch origin main --depth=1
          git checkout --detach origin/main
          npm ci --ignore-scripts
          npm run lab:army14

      - name: Candidate experiment
        shell: bash
        env:
          LAB_MUTATION: ${{ inputs.mutation || format('candidate-{0}', github.sha) }}
          LAB_PHASE: candidate
        run: |
          git checkout --detach ${{ github.sha }}
          npm ci --ignore-scripts
          npm run lab:army14

      - name: Compute per-soldier deltas
        run: npm run lab:army14:compare

      - name: Upload lab evidence
        uses: actions/upload-artifact@v4
        with:
          name: army14-evolution-lab
          path: .lab/results/*.json

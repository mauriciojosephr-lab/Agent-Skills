name: EASY Creative Real Provider Test

on:
  push:
    branches: [main]

jobs:
  real-provider-test:
    if: contains(github.event.head_commit.message, '[creative-self-test]')
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Railway deployment
        run: sleep 60
      - name: Run real Creative provider self-test
        env:
          URL: https://easy-platform-runtime-v3-production.up.railway.app/api/creative/health
        run: |
          set -u
          response="$(curl --silent --show-error --max-time 300 -w '\nHTTP_STATUS:%{http_code}' "$URL")"
          echo "$response"
          body="${response%$'\nHTTP_STATUS:'*}"
          code="${response##*HTTP_STATUS:}"
          if [ "$code" != "200" ]; then
            echo "REAL_PROVIDER_HTTP_FAILURE code=$code body=$body"
            exit 1
          fi
          node -e '
            const x = JSON.parse(process.argv[1]);
            if (x.status !== "SUCCEEDED" || x.decision !== "PASS" || x.generatedImage !== true || x.passed !== true) {
              console.error("REAL_PROVIDER_TEST_FAILED", JSON.stringify(x));
              process.exit(1);
            }
            console.log("REAL_PROVIDER_TEST_PASS", JSON.stringify(x));
          ' "$body"

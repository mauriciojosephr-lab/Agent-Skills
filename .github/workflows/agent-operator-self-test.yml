name: agent-operator-self-test

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    paths:
      - 'skills/agent-operator/**'
      - 'scripts/agent-operator-self-test.mjs'
      - '.github/workflows/agent-operator-self-test.yml'

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run self-test
        run: node scripts/agent-operator-self-test.mjs

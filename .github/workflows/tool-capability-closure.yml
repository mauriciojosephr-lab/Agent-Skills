name: tool-capability-closure

on:
  push:
    paths:
      - 'tools/**'
      - 'scripts/tool-system-self-test.mjs'
      - 'scripts/skill-audit.mjs'
      - '.github/workflows/tool-capability-closure.yml'
  pull_request:
    paths:
      - 'tools/**'
      - 'scripts/tool-system-self-test.mjs'
      - 'scripts/skill-audit.mjs'
      - '.github/workflows/tool-capability-closure.yml'

jobs:
  validate-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/tool-system-self-test.mjs
      - run: node scripts/skill-audit.mjs

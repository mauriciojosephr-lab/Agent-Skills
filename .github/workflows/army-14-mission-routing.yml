name: ARMY-14 Mission Routing

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node --test apps/easy-developer-platform/test-army-14-mission-router.mjs

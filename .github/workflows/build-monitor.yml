name: Build Monitor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/easy-developer-platform/build-monitor.mjs'
      - 'apps/easy-developer-platform/project-queue-orchestrator.mjs'
      - 'apps/easy-developer-platform/soldier-systems/**'
      - '.easy/project-queue-state.json'
      - '.github/workflows/build-monitor.yml'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: build-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify monitor contract
        run: npm run test:build-monitor
      - name: Generate construction report
        run: npm run monitor:build
      - name: Publish report to job summary
        run: |
          {
            echo '## Construction Monitor'
            echo
            echo 'The percentages below are evidence-based: only VERIFIED tasks count as completion.'
            echo
            echo '```json'
            cat .easy/build-monitor/latest.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload construction report
        uses: actions/upload-artifact@v4
        with:
          name: construction-monitor-${{ github.run_id }}
          path: .easy/build-monitor/latest.json
          retention-days: 30

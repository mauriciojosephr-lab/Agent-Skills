name: Deploy EASY Runtime Current

on:
  push:
    branches: [main]
    paths:
      - "apps/easy-developer-platform/**"
      - "apps/army14-evolution-lab/**"
      - "apps/control-plane/**"
      - "apps/revenue-engine/**"
      - "package.json"
      - "package-lock.json"
      - ".dockerignore"
      - "skills/**"
      - ".github/workflows/easy-runtime-deploy-latest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Verify Railway token is present
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: test -n "$RAILWAY_TOKEN"

      - name: Deploy exact checked-out source to existing Railway service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --service easy-runtime-current --project 4c4c8630-b755-401b-a3e0-42fdd70b7bb2 --environment production --ci --detach

      - name: Record deployed source
        run: |
          echo "GitHub source commit: $GITHUB_SHA"
          git rev-parse HEAD

# Deploys the exact checked-out GitHub main commit to the existing EASY Railway service.

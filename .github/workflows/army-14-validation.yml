name: ARMY-14 validation

on:
  push:
    paths:
      - '.github/agents/**'
      - 'docs/ARMY-14.md'
      - '.github/workflows/army-14-validation.yml'
  pull_request:
    paths:
      - '.github/agents/**'
      - 'docs/ARMY-14.md'
      - '.github/workflows/army-14-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-roster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate ARMY-14 roster
        shell: bash
        run: |
          set -u
          files=(
            01-architect-soldier.agent.md
            02-builder-soldier.agent.md
            03-ui-ux-soldier.agent.md
            04-backend-api-soldier.agent.md
            05-database-soldier.agent.md
            06-security-soldier.agent.md
            07-integration-soldier.agent.md
            08-ai-agent-soldier.agent.md
            09-test-qa-soldier.agent.md
            10-browser-e2e-soldier.agent.md
            11-debug-repair-soldier.agent.md
            12-deployment-ops-soldier.agent.md
            13-product-mvp-soldier.agent.md
            14-research-capability-soldier.agent.md
          )
          failed=0
          count=$(find .github/agents -maxdepth 1 -type f -name '*-soldier.agent.md' | wc -l)
          echo "soldier-file-count=$count"
          if [ "$count" -ne 14 ]; then failed=1; fi
          test -f docs/ARMY-14.md || failed=1
          for file in "${files[@]}"; do
            path=".github/agents/$file"
            echo "checking $path"
            if [ ! -f "$path" ]; then echo "MISSING $path"; failed=1; continue; fi
            for heading in '## Mission' '## Execution loop' '## Quality bar' '## Skill arsenal' '## Agentic capabilities' '## Mission output'; do
              if ! grep -Fq "$heading" "$path"; then echo "MISSING HEADING: $heading in $path"; failed=1; fi
            done
            if ! grep -Fq '## Doctrine' "$path" && ! grep -Fq '## Operating doctrine' "$path"; then echo "MISSING DOCTRINE in $path"; failed=1; fi
            if grep -Eiq '(api[_-]?key|access[_-]?token|BEGIN (RSA|OPENSSH|EC|PRIVATE) KEY|password\s*[:=])' "$path"; then echo "SECRET-LIKE PATTERN in $path"; failed=1; fi
          done
          grep -Fq '13 | Product/MVP' docs/ARMY-14.md || { echo 'MISSING PRODUCT/MVP REGISTRY ENTRY'; failed=1; }
          grep -Fq '14 | Research/Capability' docs/ARMY-14.md || { echo 'MISSING RESEARCH REGISTRY ENTRY'; failed=1; }
          if [ "$failed" -ne 0 ]; then echo 'ARMY-14 validation FAILED'; exit 1; fi
          echo 'ARMY-14 validation PASSED.'

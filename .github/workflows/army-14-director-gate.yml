name: ARMY-14 Director Gate

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: army-14-director-gate
  cancel-in-progress: false

jobs:
  director:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:army14:systems
      - run: node --test apps/easy-developer-platform/test-army-14-director.mjs
      - run: npm run test:elite:field-exercise

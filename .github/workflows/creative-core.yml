name: creative-core

on:
  push:
    paths:
      - 'apps/easy-developer-platform/creative-*.mjs'
      - 'apps/easy-developer-platform/openai-creative-provider.mjs'
      - 'apps/easy-developer-platform/customer-auth.mjs'
      - 'apps/easy-developer-platform/runtime.mjs'
      - 'apps/easy-developer-platform/gateway.mjs'
      - 'apps/easy-developer-platform/test-creative-*.mjs'
      - 'apps/easy-developer-platform/test-openai-creative-provider.mjs'
      - 'package.json'
      - '.github/workflows/creative-core.yml'
  pull_request:
    paths:
      - 'apps/easy-developer-platform/creative-*.mjs'
      - 'apps/easy-developer-platform/openai-creative-provider.mjs'
      - 'apps/easy-developer-platform/customer-auth.mjs'
      - 'apps/easy-developer-platform/runtime.mjs'
      - 'apps/easy-developer-platform/gateway.mjs'
      - 'apps/easy-developer-platform/test-creative-*.mjs'
      - 'apps/easy-developer-platform/test-openai-creative-provider.mjs'
      - 'package.json'
      - '.github/workflows/creative-core.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:creative
      - run: npm run test:creative-stage
      - run: npm run test:creative-provider
      - run: node --check apps/easy-developer-platform/runtime.mjs
      - run: node --check apps/easy-developer-platform/gateway.mjs
      - run: node --check apps/easy-developer-platform/customer-auth.mjs
      - run: node --check apps/easy-developer-platform/creative-orchestrator.mjs
      - run: node --check apps/easy-developer-platform/openai-creative-provider.mjs

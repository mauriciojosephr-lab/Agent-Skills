name: Elite Harness v2

on:
  push:
    branches: [main]
    paths:
      - 'apps/easy-developer-platform/elite-*.mjs'
      - 'apps/easy-developer-platform/test-elite-*.mjs'
      - 'apps/easy-developer-platform/autonomous-coder.mjs'
      - 'package.json'
  pull_request:
    branches: [main]
    paths:
      - 'apps/easy-developer-platform/elite-*.mjs'
      - 'apps/easy-developer-platform/test-elite-*.mjs'
      - 'apps/easy-developer-platform/autonomous-coder.mjs'
      - 'package.json'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:elite:harness
      - run: npm run test:elite:engine
      - run: npm run test:elite:components
      - run: npm run test:elite:planner
      - run: npm run test:elite:queue
      - run: npm run test:elite:benchmark
      - run: git diff --check

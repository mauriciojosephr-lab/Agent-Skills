<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EASY — حساب البائع</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#17202a;background:#f5f7fa}body{margin:0}.wrap{max-width:820px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #e2e7ee;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 5px 20px #00000008}input,button{font:inherit;width:100%;box-sizing:border-box;border-radius:12px;padding:12px;border:1px solid #cbd5e1;margin-top:8px}button{background:#111827;color:#fff;border:0;font-weight:800;cursor:pointer}.secondary{background:#fff;color:#111827;border:1px solid #cbd5e1}.row{display:flex;gap:8px}.row>*{flex:1}.ok{background:#ecfdf5;color:#065f46;padding:10px;border-radius:10px}.warn{background:#fff7ed;color:#9a3412;padding:10px;border-radius:10px}.muted{color:#64748b;font-size:13px}.status{font-weight:800}.hidden{display:none}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a{padding:9px 12px;border-radius:10px;background:#eef2ff;color:#3730a3;text-decoration:none;font-weight:700}.small{font-size:12px}
</style></head>
<body><main class="wrap">
<section class="card"><h1>EASY</h1><p>حساب البائع — تسجيل الدخول والوصول إلى Creative Engine.</p><div class="nav"><a href="/">الرئيسية</a><a href="/creative">Creative</a><a href="/integration">Developer Platform</a></div></section>
<section id="auth" class="card"><h2 id="authTitle">إنشاء حساب</h2><input id="name" placeholder="الاسم"><input id="email" type="email" placeholder="البريد الإلكتروني"><input id="password" type="password" placeholder="كلمة المرور"><div class="row"><button id="submit">إنشاء الحساب</button><button class="secondary" id="toggle">لدي حساب بالفعل</button></div><p id="authStatus" class="muted"></p></section>
<section id="session" class="card hidden"><h2>الحساب متصل</h2><p id="me"></p><div class="row"><button onclick="location.href='/creative'">ابدأ Creative</button><button class="secondary" id="logout">تسجيل الخروج</button></div><p class="small muted">الجلسة تحفظ رمز الدخول في هذا المتصفح فقط. بيانات الحساب نفسها يديرها Supabase عبر خدمة المصادقة الحالية.</p></section>
<script>
const $=id=>document.getElementById(id);let loginMode=false;
function token(){return localStorage.getItem('easy_access_token')||''}
async function api(path,opt={}){const headers={'content-type':'application/json',...(opt.headers||{})};if(token())headers.authorization='Bearer '+token();const r=await fetch(path,{...opt,headers});const d=await r.json().catch(()=>({error:'invalid_response'}));if(!r.ok)throw Error(d.error||('HTTP '+r.status));return d}
function render(){const t=token();$('auth').classList.toggle('hidden',!!t);$('session').classList.toggle('hidden',!t);if(t)api('/api/customer/me').then(d=>{$('me').textContent='مرحبًا '+(d.customer?.name||d.customer?.email||'بائع')}).catch(()=>{localStorage.removeItem('easy_access_token');render()})}
$('toggle').onclick=()=>{loginMode=!loginMode;$('authTitle').textContent=loginMode?'تسجيل الدخول':'إنشاء حساب';$('submit').textContent=loginMode?'دخول':'إنشاء الحساب';$('name').classList.toggle('hidden',loginMode);$('authStatus').textContent=''};
$('submit').onclick=async()=>{try{$('authStatus').textContent='جارٍ التنفيذ…';const path=loginMode?'/api/customer/login':'/api/customer/register';const body={email:$('email').value.trim(),password:$('password').value};if(!loginMode)body.name=$('name').value.trim();const d=await api(path,{method:'POST',body:JSON.stringify(body)});if(d.accessToken)localStorage.setItem('easy_access_token',d.accessToken);$('authStatus').className='ok';$('authStatus').textContent='تم الاتصال بالحساب.';render()}catch(e){$('authStatus').className='warn';$('authStatus').textContent=e.message}};
$('logout').onclick=async()=>{try{await api('/api/customer/logout',{method:'POST'})}catch{}localStorage.removeItem('easy_access_token');render()};render();
</script></main></body></html>

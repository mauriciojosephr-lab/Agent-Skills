openapi: 3.0.3
info:
  title: EASY Developer Platform Control API
  version: 2.0.0
  description: Provider-neutral, guarded control plane for building EASY.
servers:
  - url: http://localhost:8790
security:
  - bearerAuth: []
paths:
  /api/health:
    get:
      security: []
      responses: {'200': {description: Healthy}}
  /api/platform:
    get:
      security: []
      responses: {'200': {description: Platform metadata}}
  /api/runtime:
    get: {responses: {'200': {description: Provider readiness}}}
  /api/registry:
    get: {responses: {'200': {description: Skills APIs and tools registry}}}
  /api/projects:
    get: {responses: {'200': {description: Projects}}}
    post:
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProjectInput'}}}}
      responses: {'201': {description: Created}, '400': {description: Invalid request}, '409': {description: Project exists}}
  /api/workspace:
    get:
      parameters: [{name: project, in: query, required: true, schema: {type: string}}]
      responses: {'200': {description: Workspace listing}}
  /api/workspace/file:
    get:
      parameters: [{name: project, in: query, required: true, schema: {type: string}}, {name: path, in: query, required: true, schema: {type: string}}]
      responses: {'200': {description: File contents}, '404': {description: Not found}}
    post:
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WorkspaceFile'}}}}
      responses: {'201': {description: Written}, '422': {description: Guardian blocked content}}
  /api/agent/tasks:
    get: {responses: {'200': {description: Tasks}}}
    post:
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AgentTaskInput'}}}}
      responses: {'202': {description: Queued}, '404': {description: Project not found}}
  /api/agent/tasks/{id}/advance:
    post:
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Advanced}, '409': {description: Invalid state}}
  /api/builds:
    get: {responses: {'200': {description: Builds}}}
    post:
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BuildInput'}}}}
      responses: {'201': {description: Build queued}, '404': {description: Project not found}}
  /api/builds/{id}/advance:
    post:
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Build advanced}, '404': {description: Build not found}, '409': {description: Cannot advance}}
  /api/builds/approve:
    post:
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [buildId], properties: {buildId: {type: string}}}}}}
      responses: {'200': {description: Approved}, '404': {description: Build not found}}
  /api/approvals:
    get: {responses: {'200': {description: Approval history}}}
  /api/guardian/check:
    post:
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [content], properties: {content: {type: string}}}}}}
      responses: {'200': {description: Guardian decision}}
  /api/guardian/workspace:
    post:
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [project], properties: {project: {type: string}}}}}}
      responses: {'200': {description: Workspace Guardian result}}
  /api/tests/syntax:
    post:
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [project], properties: {project: {type: string}}}}}}
      responses: {'200': {description: Syntax result}}
  /api/tests/run:
    post: {responses: {'200': {description: Deterministic v2 verification}}}
  /api/checks/run:
    post: {responses: {'200': {description: Deterministic v2 verification alias}}}
  /api/checks:
    get: {responses: {'200': {description: Verification history}}}
  /api/events:
    get: {responses: {'200': {description: Audit and platform events}}}
  /api/preview:
    get:
      parameters: [{name: project, in: query, schema: {type: string}}]
      responses: {'200': {description: Preview boundary}}
  /api/deploy:
    post: {responses: {'409': {description: Deployment blocked until a validated adapter exists}}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  schemas:
    ProjectInput:
      type: object
      required: [name]
      properties: {name: {type: string}, branch: {type: string, default: main}, owner: {type: string}}
    WorkspaceFile:
      type: object
      required: [project, path, content]
      properties: {project: {type: string}, path: {type: string}, content: {type: string}}
    AgentTaskInput:
      type: object
      required: [prompt]
      properties: {project: {type: string}, prompt: {type: string}}
    BuildInput:
      type: object
      properties: {project: {type: string, default: easy-core}, purpose: {type: string, default: build}}
